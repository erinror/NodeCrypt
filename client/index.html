<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>NodeCrypt</title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/body.css">
	<link rel="stylesheet" href="css/phone.css">
	<link rel="stylesheet" href="css/form-animation.css">
	<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
	<meta name="description" content="NodeCrypt - True end-to-end encrypted chat system.">
	<style>
		.preload * { transition: none !important; }
		/* 新增样式：管理员登录和分享弹窗 */
		.modal-overlay {
			display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
			background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center;
			backdrop-filter: blur(5px);
		}
		.modal-box {
			background: #1e1e1e; padding: 25px; border-radius: 12px; border: 1px solid #333;
			width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
		}
		.modal-title { color: #fff; margin-bottom: 20px; font-size: 1.2rem; text-align: center; }
		.admin-input {
			width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444;
			color: #fff; border-radius: 6px; margin-bottom: 15px; outline: none; box-sizing: border-box;
		}
		.admin-input:focus { border-color: #666; }
		.modal-btn-group { display: flex; gap: 10px; margin-top: 10px; }
		.modal-btn {
			flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer;
			font-weight: bold; transition: opacity 0.2s;
		}
		.btn-confirm { background: #fff; color: #000; }
		.btn-cancel { background: #333; color: #ccc; }
		.modal-btn:hover { opacity: 0.9; }
		/* 分享结果样式 */
		.share-result { margin-top: 15px; padding: 10px; background: #252525; border-radius: 4px; word-break: break-all; display: none; }
		.share-result a { color: #4CAF50; text-decoration: none; }
		
		/* 设置菜单中的分享按钮 */
		.settings-item.admin-only { display: none; } /* 默认隐藏 */
	</style>
</head>
<body class="preload">

	<!-- 1. 管理员登录弹窗 -->
	<div id="admin-login-modal" class="modal-overlay">
		<div class="modal-box">
			<h3 class="modal-title">管理员身份验证</h3>
			<form id="admin-login-form">
				<input type="password" id="admin-pwd" class="admin-input" placeholder="请输入访问密码..." autocomplete="off">
				<div class="modal-btn-group">
					<button type="submit" class="modal-btn btn-confirm">解锁</button>
				</div>
			</form>
		</div>
	</div>

	<!-- 2. 生成分享链接弹窗 -->
	<div id="invite-modal" class="modal-overlay">
		<div class="modal-box">
			<h3 class="modal-title">生成邀请链接</h3>
			<div style="color:#aaa; font-size:0.9rem; margin-bottom:10px;">限制使用次数 (0 表示无限):</div>
			<input type="number" id="invite-limit" class="admin-input" value="1" min="0">
			
			<div style="color:#aaa; font-size:0.9rem; margin-bottom:10px;">备注 (可选):</div>
			<input type="text" id="invite-note" class="admin-input" placeholder="例如: 给张三的邀请">
			
			<div id="invite-result" class="share-result"></div>
			
			<div class="modal-btn-group">
				<button id="btn-create-invite" class="modal-btn btn-confirm">生成</button>
				<button onclick="document.getElementById('invite-modal').style.display='none'" class="modal-btn btn-cancel">关闭</button>
			</div>
		</div>
	</div>

	<!-- 原有登录界面 -->
	<div class="login-container" id="login-container">
		<div class="flip-card" id="flip-card">
			<div class="flip-card-inner">
				<div class="flip-card-front">
					<button class="help-btn" id="help-btn" type="button"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg></button>
					<h1 id="login-title"></h1>
					<form id="login-form"></form>
				</div>
				<div class="flip-card-back">
					<button class="help-btn back-btn" id="back-btn" type="button"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18L9 12L15 6"/></svg></button>
					<h2 data-i18n="help.usage_guide"></h2>
					<div class="help-content">
                        <!-- 保留原有帮助内容 -->
						<div class="help-section"><h3 data-i18n="help.what_is_nodecrypt"></h3><p data-i18n="help.what_is_nodecrypt_desc"></p></div>
					</div>
				</div>
			</div>
		</div>
		<div class="powered-by">Powered by <a href="#">NodeCrypt</a></div>
	</div>

	<!-- 聊天主界面 -->
	<div class="container" id="chat-container" style="display:none;">
		<div class="mobile-sidebar-mask" id="mobile-sidebar-mask"></div>
		<div class="mobile-rightbar-mask" id="mobile-rightbar-mask"></div>
		
		<!-- 设置侧边栏 -->
		<div class="settings-sidebar" id="settings-sidebar" style="display:none;">
			<div class="settings-header">
				<button class="settings-back-btn" id="settings-back-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#808080" stroke-width="2"><path d="M15 18L9 12L15 6"/></svg></button>
				<h2 class="settings-title" id="settings-title"></h2>
			</div>
			<div class="settings-content" id="settings-content">
				<!-- 原有设置内容将通过 JS 插入 -->
				
				<!-- 3. 新增：邀请链接按钮 (仅管理员可见) -->
				<div class="settings-group admin-only" id="admin-share-group" style="margin-top: 20px; border-top: 1px solid #333; padding-top: 15px;">
					<div class="settings-item" onclick="document.getElementById('invite-modal').style.display='flex'">
						<div class="settings-icon">
							<svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
						</div>
						<div class="settings-label">生成邀请链接</div>
					</div>
				</div>
			</div>
		</div>

		<div class="sidebar" id="sidebar">
			<div class="sidebar-user"> <span class="avatar" id="sidebar-user-avatar"></span> <span class="sidebar-username" id="sidebar-username"></span> <button class="settings-btn" id="settings-btn"> <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#808080" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> </button> </div>
			<div class="join-room"> <svg class="MuiSvgIcon-root icon-22-middle" focusable="false" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3.01H3c-1.1 0-2 .9-2 2V9h2V4.99h18v14.03H3V15H1v4.01c0 1.1.9 1.98 2 1.98h18c1.1 0 2-.88 2-1.98v-14c0-1.11-.9-2-2-2zM11 16l4-4-4-4v3H1v2h10v3z"></path></svg> <span id="join-room-text"></span> </div>
			<div class="rooms" id="room-list"> </div>
		</div>

		<div class="main">
			<div class="main-header" id="main-header"> </div>
			<div class="chat-area" id="chat-area"> </div>
			<div class="chat-input-area">
				<!-- 输入区域保持原样 -->
				<div class="rows-wrapper chat-input-wrapper chat-input-main-wrapper chat-rows-wrapper">
					<div class="new-message-wrapper rows-wrapper-row" data-offset="commands"> 
                        <button class="chat-emoji-btn" type="button"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#808080"><path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke-width="2"/><path d="M8 14C8 14 9.5 16 12 16C14.5 16 16 14 16 14" stroke-width="2" stroke-linecap="round"/><path d="M9 9H9.01" stroke-width="2" stroke-linecap="round"/><path d="M15 9H15.01" stroke-width="2" stroke-linecap="round"/></svg></button>
						<div class="input-message-container">
							<div class="input-message-input is-empty scrollable scrollable-y no-scrollbar input-message-input-init" contenteditable="true" dir="auto" tabindex="-1"></div> <span class="input-field-placeholder i18n is-empty"></span>
							<div contenteditable="true" tabindex="-1" class="input-message-input is-empty scrollable scrollable-y no-scrollbar input-field-input-fake"></div> 
                            <button class="chat-attach-btn chat-attach-btn-abs" type="button"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#808080" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg></button>
						</div> <input type="file" multiple class="input-hidden">
					</div>
				</div>
				<div class="send-message-btn"><span class="text"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg></span></div>
			</div>
		</div>

		<div class="rightbar" id="rightbar">
			<div class="rightbar-header"><div class="rightbar-group"><div class="group-info"><div class="title" id="members-title"></div><div class="group-desc" id="rightbar-group-desc"></div></div></div></div>
			<div class="rightbar-tabs tabs" id="member-tabs"> </div><div class="members" id="member-list"> </div>
		</div>
	</div>
	<script type="module" src="./js/main.js"></script>
</body>
</html>
